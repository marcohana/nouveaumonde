<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>À la découverte d'un nouveau monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A41;
    --ink-soft:#4C5A70;
    --parchment:#F1E7CE;
    --parchment-deep:#E4D3A9;
    --card:#FBF3E1;
    --card-line: rgba(27,42,65,0.14);
    --sea:#2B6777;
    --sea-deep:#1F4C57;
    --gold:#A5730B;
    --gold-soft:#D8A93B;
    --rust:#9A3A3D;
    --white-choice:#F5F1E6;
    --radius:14px;
    --shadow: 0 1px 2px rgba(27,42,65,0.06), 0 8px 24px -8px rgba(27,42,65,0.18);
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(43,103,119,0.10), transparent),
      radial-gradient(900px 500px at 110% 10%, rgba(165,115,11,0.10), transparent),
      var(--parchment);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0 0 4px;letter-spacing:-0.01em;}
  .num{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--sea); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- header / brand ---------- */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .brand .wheel{width:42px;height:42px;flex:0 0 auto;color:var(--sea-deep);}
  .brand-text .eyebrow{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--sea-deep);opacity:.75;
  }
  .brand-text h1{font-size:22px;color:var(--ink);}

  /* ---------- layout helpers ---------- */
  .stack{display:flex;flex-direction:column;gap:14px;}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .muted{color:var(--ink-soft);font-size:14px;line-height:1.5;}
  code{
    background:var(--parchment-deep);border:1px solid var(--card-line);border-radius:5px;
    padding:1px 6px;font-family:'Space Mono',monospace;font-size:12px;color:var(--ink);
    word-break:break-all;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .spacer{flex:1;}

  /* ---------- cards / buttons ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
  }
  .card.tight{padding:14px 16px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;border-radius:10px;border:1px solid transparent;
    font-weight:600;font-size:15px;transition:transform .12s ease, filter .12s ease;
    text-align:center;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.42;cursor:not-allowed;transform:none;}
  .btn-primary{background:var(--sea-deep);color:#fff;}
  .btn-primary:not(:disabled):hover{filter:brightness(1.08);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-gold:not(:disabled):hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--card-line);}
  .btn-ghost:not(:disabled):hover{background:rgba(27,42,65,0.05);}
  .btn-danger{background:var(--rust);color:#fff;}
  .btn-danger:not(:disabled):hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-lg{padding:18px 20px;font-size:16px;border-radius:12px;}

  .link-btn{background:none;border:none;color:var(--sea-deep);font-weight:600;font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;}

  .input{
    width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--card-line);
    background:#fff;font-size:16px;color:var(--ink);font-family:'Space Mono',monospace;
    letter-spacing:.06em;
  }
  .input:focus{border-color:var(--sea);}
  .field-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:6px;display:block;}

  .error-box{
    background:rgba(154,58,61,0.08);border:1px solid rgba(154,58,61,0.35);
    color:var(--rust);padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;
  }

  .code-pill{
    font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.14em;
    background:var(--sea-deep);color:#fff;padding:8px 14px;border-radius:8px;font-size:18px;
  }

  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    padding:4px 9px;border-radius:99px;letter-spacing:.02em;
  }
  .badge-progress{background:rgba(43,103,119,0.14);color:var(--sea-deep);}
  .badge-finished{background:rgba(27,42,65,0.10);color:var(--ink-soft);}

  /* ---------- choice buttons (team screen) ---------- */
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .choice-btn{
    border-radius:16px;border:2px solid rgba(0,0,0,0.08);
    padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
    color:#fff;font-weight:700;font-size:16px;box-shadow:var(--shadow);
    transition:transform .12s ease;
  }
  .choice-btn:active{transform:scale(.97);}
  .choice-btn .swatch-letter{
    font-family:'Fraunces',serif;font-size:34px;font-weight:900;line-height:1;
  }
  .choice-btn.on-light{color:var(--ink);}
  .choice-btn.on-light .swatch-letter{color:var(--ink);}

  /* ---------- waiting / reveal states ---------- */
  .pulse-dot{
    width:10px;height:10px;border-radius:50%;background:var(--gold-soft);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.1);}}

  .reveal-combo{display:flex;gap:8px;justify-content:center;margin:6px 0 4px;}
  .reveal-letter{
    width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:#fff;box-shadow:var(--shadow);
  }
  .reveal-letter.on-light{color:var(--ink);}

  .gain{font-weight:800;}
  .gain.positive{color:#2F6B4F;}
  .gain.negative{color:var(--rust);}
  .gain.zero{color:var(--ink-soft);}

  /* ---------- ledger table ---------- */
  .ledger-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--card-line);}
  table.ledger{border-collapse:collapse;width:100%;min-width:560px;background:var(--card);font-size:13px;}
  table.ledger th, table.ledger td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--card-line);}
  table.ledger thead th{
    background:var(--sea-deep);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    position:sticky;top:0;
  }
  table.ledger tbody tr:nth-child(even){background:rgba(27,42,65,0.03);}
  table.ledger tfoot td{font-weight:800;background:var(--parchment-deep);}
  .cell-letter{font-family:'Space Mono',monospace;font-weight:700;}

  /* ---------- history strip (team view) ---------- */
  .history-strip{display:flex;flex-direction:column;gap:6px;}
  .history-row{
    display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;
    background:var(--card);border:1px solid var(--card-line);border-radius:9px;
  }
  .history-row .rn{font-family:'Space Mono',monospace;color:var(--ink-soft);width:26px;}

  /* ---------- dashboard grid ---------- */
  .universe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .universe-card{
    background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);
    padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    transition:transform .12s ease, box-shadow .12s ease;cursor:pointer;
  }
  .universe-card:hover{transform:translateY(-2px);}
  .team-chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .team-chip{
    font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;display:flex;align-items:center;gap:4px;
    background:rgba(27,42,65,0.06);color:var(--ink-soft);
  }
  .team-chip.ok{background:rgba(47,107,79,0.14);color:#2F6B4F;}

  .empty-state{
    border:1.5px dashed var(--card-line);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--ink-soft);
  }

  .inline-confirm{
    background:rgba(154,58,61,0.06);border:1px solid rgba(154,58,61,0.3);border-radius:10px;
    padding:12px;display:flex;flex-direction:column;gap:10px;
  }

  .footer-note{margin-top:34px;text-align:center;font-size:12px;color:var(--ink-soft);opacity:.75;}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sea-deep);background:none;border:none;padding:0 0 14px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =====================================================================
   DONNÉES DU JEU
   ===================================================================== */
const TEAMS = {
  pinta:      { key:'pinta',      label:'La Pinta',
                choices:[{code:'B', label:'Bleu',  hex:'#1D4E89', light:false},
                         {code:'R', label:'Rouge', hex:'#A3352E', light:false}] },
  santaMaria: { key:'santaMaria', label:'La Santa Maria',
                choices:[{code:'W', label:'Blanc', hex:'#F5F1E6', light:true},
                         {code:'G', label:'Vert',  hex:'#2E7D46', light:false}] },
  nina:       { key:'nina',       label:'La Niña',
                choices:[{code:'O', label:'Orange', hex:'#C46A0A', light:false},
                         {code:'Y', label:'Jaune',  hex:'#C79A16', light:false}] },
};
const TEAM_ORDER = ['pinta','santaMaria','nina'];

// clé = lettre Pinta + lettre Santa Maria + lettre Niña (dans cet ordre)
const PAYOFFS = {
  BWO:{pinta:4,  santaMaria:4,  nina:4,  armateur:-12},
  RWO:{pinta:4,  santaMaria:-4, nina:-4, armateur:4},
  BWY:{pinta:-4, santaMaria:-4, nina:4,  armateur:4},
  RWY:{pinta:6,  santaMaria:-6, nina:2,  armateur:-2},
  BGO:{pinta:-4, santaMaria:4,  nina:-4, armateur:4},
  RGO:{pinta:2,  santaMaria:6,  nina:-6, armateur:-2},
  BGY:{pinta:-6, santaMaria:2,  nina:6,  armateur:-2},
  RGY:{pinta:-4, santaMaria:-4, nina:-4, armateur:12},
};

/* =====================================================================
   LOGIQUE PURE (indépendante du stockage — testable isolément)
   ===================================================================== */
function makeEmptyRound(){
  return { pinta:null, santaMaria:null, nina:null, resolved:false, gains:null };
}
function genPin(){
  return String(Math.floor(Math.random()*100)).padStart(2,'0');
}
function normalizePin(v){
  const digits = String(v||'').replace(/\D/g,'').slice(0,2);
  return digits.length ? digits.padStart(2,'0') : '';
}
function createGameObject(code, roundsPlanned){
  return {
    code,
    createdAt: Date.now(),
    status: 'in_progress',
    roundsPlanned,
    currentRound: 1,
    teamsJoined: { pinta:false, santaMaria:false, nina:false },
    teamPins: { pinta: genPin(), santaMaria: genPin(), nina: genPin() },
    rounds: Array.from({length:roundsPlanned}, makeEmptyRound),
    totals: { pinta:0, santaMaria:0, nina:0, armateur:0 },
    finishedAt: null,
  };
}
const AUTO_ADVANCE_MS = 5000;
function resolveIfComplete(game){
  const idx = game.currentRound - 1;
  const r = game.rounds[idx];
  if (!r || r.resolved) return game;
  if (r.pinta && r.santaMaria && r.nina){
    const key = r.pinta + r.santaMaria + r.nina;
    const gains = PAYOFFS[key];
    if (gains){
      r.gains = gains;
      r.resolved = true;
      r.resolvedAt = Date.now();
      game.totals.pinta += gains.pinta;
      game.totals.santaMaria += gains.santaMaria;
      game.totals.nina += gains.nina;
      game.totals.armateur += gains.armateur;
    }
  }
  return game;
}
function autoAdvanceRemaining(game){
  if (!game || game.status !== 'in_progress') return null;
  const r = game.rounds[game.currentRound - 1];
  if (!r || !r.resolved) return null;
  if (game.currentRound >= game.rounds.length) return null; // dernier tour prévu : décision animateur requise
  const elapsed = Date.now() - (r.resolvedAt || Date.now());
  return Math.max(0, AUTO_ADVANCE_MS - elapsed);
}
function applyChoice(game, team, letter){
  const idx = game.currentRound - 1;
  const r = game.rounds[idx];
  if (!r || r.resolved) return game;
  if (r[team]) return game; // déjà verrouillé
  r[team] = letter;
  return resolveIfComplete(game);
}
function canAdvance(game){
  const r = game.rounds[game.currentRound - 1];
  return !!(r && r.resolved && game.currentRound < game.rounds.length && game.status === 'in_progress');
}
function advanceRound(game){
  if (canAdvance(game)) game.currentRound += 1;
  return game;
}
function extendRounds(game, extra){
  for (let i=0;i<extra;i++) game.rounds.push(makeEmptyRound());
  game.roundsPlanned = game.rounds.length;
  return game;
}
function stopGame(game){
  game.status = 'finished';
  game.finishedAt = Date.now();
  return game;
}

/* =====================================================================
   STOCKAGE — Firebase Realtime Database via REST (aucun SDK, aucune clé
   secr\u00e8te : juste l\u2019URL publique de votre base). Fonctionne sur n\u2019importe
   quel h\u00e9bergement statique (Vercel, GitHub Pages...), ind\u00e9pendamment de
   Claude. Voir les instructions de configuration en t\u00eate de fichier.
   ===================================================================== */
const FIREBASE_DB_URL = 'https://nouveau-monde-5bf6f-default-rtdb.europe-west1.firebasedatabase.app'; // ex: https://mon-projet-default-rtdb.europe-west1.firebasedatabase.app

function firebaseConfigured(){
  return FIREBASE_DB_URL && !FIREBASE_DB_URL.includes('REPLACE_WITH_YOUR_FIREBASE_URL');
}
async function fbGet(path){
  try{
    const res = await fetch(FIREBASE_DB_URL + '/' + path + '.json');
    if (!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function fbSet(path, value){
  try{
    const res = await fetch(FIREBASE_DB_URL + '/' + path + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value),
    });
    return res.ok;
  }catch(e){ return false; }
}
async function fbDelete(path){
  try{
    const res = await fetch(FIREBASE_DB_URL + '/' + path + '.json', { method:'DELETE' });
    return res.ok;
  }catch(e){ return false; }
}
async function fbListKeys(path){
  try{
    const res = await fetch(FIREBASE_DB_URL + '/' + path + '.json?shallow=true');
    if (!res.ok) return [];
    const data = await res.json();
    return data ? Object.keys(data) : [];
  }catch(e){ return []; }
}

async function loadGame(code){
  return await fbGet('games/'+code);
}
async function saveGame(game){
  return await fbSet('games/'+game.code, game);
}
async function deleteGame(code){
  return await fbDelete('games/'+code);
}
async function listGames(){
  const codes = await fbListKeys('games');
  const games = await Promise.all(codes.map(loadGame));
  return games.filter(Boolean).sort((a,b)=> b.createdAt - a.createdAt);
}
async function getConsolePassword(){
  return await fbGet('consolePassword');
}
async function setConsolePassword(pwd){
  return await fbSet('consolePassword', pwd);
}

const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCodeRaw(len){
  let s=''; for(let i=0;i<len;i++) s += ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
  return s;
}
async function genUniqueCode(){
  for (let i=0;i<8;i++){
    const c = genCodeRaw(5);
    const existing = await loadGame(c);
    if (!existing) return c;
  }
  return genCodeRaw(7);
}

/* =====================================================================
   HELPERS D'AFFICHAGE
   ===================================================================== */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtSigned(n){
  if (n > 0) return '+'+n;
  if (n < 0) return '\u2212'+Math.abs(n);
  return '0';
}
function gainClass(n){ return n>0?'positive':(n<0?'negative':'zero'); }
function teamMeta(teamKey){ return TEAMS[teamKey]; }
function choiceMeta(teamKey, letter){
  return TEAMS[teamKey].choices.find(c=>c.code===letter);
}
function wheelSvg(size){
  return '<svg class="wheel" width="'+size+'" height="'+size+'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">'
    + '<circle cx="24" cy="24" r="6.5" stroke="currentColor" stroke-width="2.6"/>'
    + '<circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.6"/>'
    + [0,45,90,135].map(a=>'<line x1="24" y1="4" x2="24" y2="44" stroke="currentColor" stroke-width="2.6" transform="rotate('+a+' 24 24)"/>').join('')
    + '</svg>';
}
function brandHeader(eyebrow){
  return '<div class="brand">'+wheelSvg(40)
    + '<div class="brand-text"><div class="eyebrow">'+esc(eyebrow||'À LA DÉCOUVERTE D\u2019UN NOUVEAU MONDE')+'</div>'
    + '<h1>Pinta &middot; Santa Maria &middot; Ni\u00f1a</h1></div></div>';
}
function choicesReferenceTable(){
  return '<div class="ledger-wrap"><table class="ledger" style="min-width:320px;">'
    + '<thead><tr><th>\u00c9quipage</th><th>Choix 1</th><th>Choix 2</th></tr></thead>'
    + '<tbody>'
    +   TEAM_ORDER.map(t=>{
          const m = TEAMS[t];
          return '<tr><td>'+esc(m.label)+'</td>'
            + m.choices.map(c=>'<td>'
                + '<span class="reveal-letter'+(c.light?' on-light':'')+'" style="width:32px;height:32px;font-size:14px;display:inline-flex;">'+c.code+'</span>'
                + '<div class="muted" style="font-size:11px;margin-top:3px;">'+esc(c.label)+'</div>'
                + '</td>').join('')
            + '</tr>';
        }).join('')
    + '</tbody></table></div>';
}
function gainsReferenceTable(highlightKey){
  const rows = Object.keys(PAYOFFS).map(key=>{
    const g = PAYOFFS[key];
    const hi = key === highlightKey;
    return '<tr'+(hi?' style="background:rgba(165,115,11,0.20);"':'')+'>'
      + '<td class="cell-letter">'+(hi?'\u2192 ':'')+key.split('').join(' ')+'</td>'
      + TEAM_ORDER.concat(['armateur']).map(p=>'<td><span class="gain '+gainClass(g[p])+' num">'+fmtSigned(g[p])+'</span></td>').join('')
      + '</tr>';
  }).join('');
  return '<div class="ledger-wrap"><table class="ledger">'
    + '<thead><tr><th>Combinaison</th><th>Pinta</th><th>Santa Maria</th><th>Ni\u00f1a</th><th>Armateur</th></tr></thead>'
    + '<tbody>'+rows+'</tbody>'
    + '</table></div>';
}
function referenceDetails(highlightKey){
  return '<details class="card tight" style="margin-top:2px;">'
    + '<summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--sea-deep);">Tableau des choix et des gains</summary>'
    + '<div class="stack" style="margin-top:12px;">'
    +   '<div>'
    +     '<div class="muted" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Tableau des choix</div>'
    +     choicesReferenceTable()
    +   '</div>'
    +   '<div>'
    +     '<div class="muted" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Tableau des gains</div>'
    +     gainsReferenceTable(highlightKey)
    +   '</div>'
    + '</div>'
    + '</details>';
}

/* =====================================================================
   APPLICATION
   ===================================================================== */
const App = {
  state: { view:'home' },
  pollTimer: null,
  tickTimer: null,
  autoAdvancing: false,
  lastSnapshot: null,

  init(){
    if (!firebaseConfigured()){ this.setView('setup-needed'); return; }
    this.setView('home');
  },

  setView(view, extra){
    this.stopPolling();
    this.stopTick();
    this.state = Object.assign({view}, extra||{});
    this.lastSnapshot = null;
    this.render();
  },

  startPolling(fn, ms){
    this.stopPolling();
    this.pollTimer = setInterval(fn, ms || 2500);
  },
  stopPolling(){
    if (this.pollTimer){ clearInterval(this.pollTimer); this.pollTimer = null; }
  },
  stopTick(){
    if (this.tickTimer){ clearInterval(this.tickTimer); this.tickTimer = null; }
  },
  manageAutoAdvanceTick(){
    const remaining = autoAdvanceRemaining(this.state.game);
    if (remaining === null){ this.stopTick(); return; }
    if (!this.tickTimer){
      this.tickTimer = setInterval(()=> this.onAutoAdvanceTick(), 1000);
    }
  },
  onAutoAdvanceTick(){
    const remaining = autoAdvanceRemaining(this.state.game);
    if (remaining === null){ this.stopTick(); return; }
    if (remaining <= 0){
      this.stopTick();
      this.performAutoAdvance();
    } else {
      this.render();
    }
  },
  async performAutoAdvance(){
    if (this.autoAdvancing) return;
    this.autoAdvancing = true;
    try{
      let fresh = await loadGame(this.state.code);
      if (fresh && canAdvance(fresh)){
        fresh = advanceRound(fresh);
        await saveGame(fresh);
      }
      if (fresh){
        this.state.game = fresh;
        this.lastSnapshot = JSON.stringify(fresh);
      }
    } finally {
      this.autoAdvancing = false;
      this.render();
    }
  },

  render(){
    const root = document.getElementById('root');
    const v = this.state.view;
    let html = '';
    if (v==='setup-needed') html = this.viewSetupNeeded();
    else if (v==='home') html = this.viewHome();
    else if (v==='join-code') html = this.viewJoinCode();
    else if (v==='join-role') html = this.viewJoinRole();
    else if (v==='join-pin') html = this.viewJoinPin();
    else if (v==='team') html = this.viewTeam();
    else if (v==='console-gate') html = this.viewConsoleGate();
    else if (v==='console-dashboard') html = this.viewDashboard();
    else if (v==='console-detail') html = this.viewConsoleDetail();
    root.innerHTML = html;
    this.afterRender();
  },

  afterRender(){
    const v = this.state.view;
    if (v==='join-code'){
      const inp = document.getElementById('code-input');
      if (inp) inp.focus();
    }
    if (v==='team' && this.state.code && this.state.team){
      this.startPolling(()=> this.pollTeam(), 2200);
    }
    if (v==='console-dashboard'){
      this.startPolling(()=> this.pollDashboard(), 3000);
    }
    if (v==='console-detail' && this.state.code){
      this.startPolling(()=> this.pollDetail(), 2200);
    }
    if ((v==='team' || v==='console-detail') && this.state.game){
      this.manageAutoAdvanceTick();
    } else {
      this.stopTick();
    }
  },

  viewTeam(){
    const { code, team } = this.state;
    const game = this.state.game;
    if (!game) return '<div class="stack">'+brandHeader()+'<div class="card">Chargement\u2026</div></div>';
    const meta = teamMeta(team);

    if (game.status === 'finished'){
      return '<div class="stack">'
        + brandHeader(esc(meta.label))
        + this.finalRecapCard(game)
        + '</div>';
    }

    const idx = game.currentRound - 1;
    const r = game.rounds[idx];
    const mine = r[team];
    const totalBadge = '<div class="row" style="justify-content:center;">'
      + '<span class="badge badge-progress">Total actuel&nbsp;: <span class="num" style="margin-left:4px;">'+fmtSigned(game.totals[team])+'</span></span>'
      + '</div>';

    let body = '';
    if (r.resolved){
      const remaining = autoAdvanceRemaining(game);
      const waitMsg = remaining !== null
        ? 'Tour suivant dans <strong class="num">'+Math.ceil(remaining/1000)+'s</strong>\u2026'
        : 'Dernier tour de la partie \u2014 en attente de l\u2019animateur.';
      body = '<div class="card center">'
        + '<span class="badge badge-progress">Tour '+game.currentRound+' / '+game.roundsPlanned+' \u2014 r\u00e9solu</span>'
        + this.comboBlock(r)
        + '<p class="muted" style="margin-top:10px;">'+waitMsg+'</p>'
        + '</div>'
        + referenceDetails(r.pinta+r.santaMaria+r.nina);
    } else if (mine){
      const cm = choiceMeta(team, mine);
      body = '<div class="card center">'
        + '<span class="badge badge-progress">Tour '+game.currentRound+' / '+game.roundsPlanned+'</span>'
        + '<div style="margin:14px 0;">'
        +   '<div class="reveal-letter'+(cm.light?' on-light':'')+'" style="background:'+cm.hex+';margin:0 auto;">'+cm.code+'</div>'
        + '</div>'
        + '<div class="row" style="justify-content:center;gap:8px;"><span class="pulse-dot"></span><span class="muted">Choix enregistr\u00e9 \u2014 en attente des autres \u00e9quipages\u2026</span></div>'
        + '</div>'
        + referenceDetails();
    } else {
      body = '<div class="card">'
        + '<span class="badge badge-progress">Tour '+game.currentRound+' / '+game.roundsPlanned+'</span>'
        + '<p class="muted" style="margin:10px 0 14px;">Faites votre choix. Une fois valid\u00e9, il ne pourra plus \u00eatre chang\u00e9 pour ce tour.</p>'
        + '<div class="choice-grid">'
        +   meta.choices.map(c => '<button class="choice-btn'+(c.light?' on-light':'')+'" style="background:'+c.hex+';" onclick="App.submitChoiceUI(\''+c.code+'\')">'
              + '<span class="swatch-letter">'+c.code+'</span><span>'+esc(c.label)+'</span></button>').join('')
        + '</div>'
        + '</div>'
        + referenceDetails();
    }

    const history = this.teamHistory(game, team);

    return '<div class="stack">'
      + brandHeader(esc(meta.label)+' \u2014 '+esc(code))
      + totalBadge
      + body
      + (history ? '<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Journal de bord</h3>'+history+'</div>' : '')
      + '</div>';
  },
  comboBlock(r){
    return '<div class="reveal-combo">'
      + TEAM_ORDER.map(t=>{ const cm = choiceMeta(t, r[t]); return '<div class="reveal-letter'+(cm.light?' on-light':'')+'" style="background:'+cm.hex+';">'+cm.code+'</div>'; }).join('')
      + '</div>'
      + '<div class="row" style="justify-content:center;gap:16px;margin-top:6px;">'
      + TEAM_ORDER.concat(['armateur']).map(t=>{
          const label = t==='armateur' ? 'Armateur' : TEAMS[t].label.replace('La ','');
          const g = r.gains[t];
          return '<div style="text-align:center;"><div class="muted" style="font-size:11px;">'+esc(label)+'</div><div class="gain '+gainClass(g)+' num">'+fmtSigned(g)+'</div></div>';
        }).join('')
      + '</div>';
  },
  teamHistory(game, team){
    const rows = game.rounds.map((r,i)=>({r,i})).filter(x=>x.r.resolved);
    if (!rows.length) return '';
    let running = 0;
    const lines = rows.map(({r,i})=>{
      running += r.gains[team];
      return '<div class="history-row"><span class="rn num">#'+(i+1)+'</span>'
        + '<span class="cell-letter">'+esc(r[team])+'</span>'
        + '<span class="gain '+gainClass(r.gains[team])+' num">'+fmtSigned(r.gains[team])+'</span>'
        + '<span class="spacer"></span>'
        + '<span class="muted">cumul&nbsp;</span><span class="num" style="font-weight:700;">'+running+'</span>'
        + '</div>';
    });
    return '<div class="history-strip">'+lines.reverse().join('')+'</div>';
  },
  finalRecapCard(game){
    const ranking = TEAM_ORDER.map(t=>({key:t,label:TEAMS[t].label,total:game.totals[t]}))
      .sort((a,b)=>b.total-a.total);
    const medals = ['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'];
    return '<div class="card center">'
      + '<span class="badge badge-finished">Partie termin\u00e9e \u00b7 '+game.rounds.filter(r=>r.resolved).length+' tours jou\u00e9s</span>'
      + '<h2 style="margin-top:12px;">Classement final</h2>'
      + '<div class="stack" style="width:100%;max-width:340px;margin-top:8px;">'
      +   ranking.map((t,i)=>'<div class="row" style="justify-content:space-between;align-items:center;background:var(--parchment-deep);padding:10px 14px;border-radius:10px;">'
            + '<span>'+medals[i]+' '+esc(t.label)+'</span><span class="gain '+gainClass(t.total)+' num" style="font-size:17px;">'+fmtSigned(t.total)+'</span></div>').join('')
      + '</div>'
      + '<p class="muted" style="margin-top:16px;">Armateur : <span class="gain '+gainClass(game.totals.armateur)+' num">'+fmtSigned(game.totals.armateur)+'</span></p>'
      + '<p class="muted">Merci d\u2019avoir jou\u00e9 !</p>'
      + '</div>';
  },

  viewConsoleDetail(){

    if (!game) return '<div class="stack">'+brandHeader()+'<div class="card">Chargement\u2026</div></div>';

    const cur = game.rounds[game.currentRound-1];

      + '</div>';

    let roundCard = '<div class="card">'
      + '<div class="row" style="justify-content:space-between;align-items:center;">'
      +   '<h3 style="font-size:16px;">Tour '+game.currentRound+' / '+game.roundsPlanned+'</h3>'
      +   '<span class="badge '+(game.status==='finished'?'badge-finished':'badge-progress')+'">'+(game.status==='finished'?'Partie termin\u00e9e':(cur&&cur.resolved?'R\u00e9solu':'En attente des \u00e9quipages'))+'</span>'
      + '</div>'
      + (game.status!=='finished' ? '<div style="margin-top:10px;">'+statusChips+'</div>' : '')
      + (cur && cur.resolved ? '<div style="margin-top:14px;">'+this.comboBlock(cur)+'</div>' : '')
      + (remaining !== null ? '<p class="muted" style="margin-top:10px;">Passage automatique au tour suivant dans <strong class="num">'+Math.ceil(remaining/1000)+'s</strong>\u2026</p>' : '')
      + '</div>'
      + (game.status!=='finished' ? referenceDetails(cur && cur.resolved ? cur.pinta+cur.santaMaria+cur.nina : undefined) : '');

    let controls = '';
    if (game.status !== 'finished'){
      controls = '<div class="card">'
        + '<h3 style="font-size:15px;margin-bottom:12px;">Contr\u00f4les</h3>'
        + '<div class="row">'
        +   (remaining !== null ? '<button class="btn btn-primary" onclick="App.performAutoAdvanceNow()">Passer maintenant \u25b6</button>' : '')
        +   '<button class="btn btn-ghost" onclick="App.toggleExtend()">+ Ajouter des tours</button>'
        +   '<button class="btn btn-danger" onclick="App.toggleStopConfirm()">Arr\u00eater la partie</button>'
        + '</div>'
        + (atLastSlot && cur && cur.resolved ? '<p class="muted" style="margin-top:8px;">Dernier tour pr\u00e9vu \u2014 ajoutez des tours pour continuer, ou arr\u00eatez la partie.</p>' : '')
        + (this.state.showExtend ? this.extendForm() : '')
        + (this.state.confirmStop ? this.stopConfirm() : '')
        + '</div>';
    } else {
      controls = this.finalRecapCard(game);
    }

    return '<div class="stack">'
      + this.backLink('console-dashboard','\u2190 Tous les univers')
      + brandHeader('CONSOLE \u2014 '+esc(game.code))
      + this.totalsRecapCard(game)
      + this.pinsCard(game)
      + roundCard
      + controls
      + '<div class="card">'
      +   '<h3 style="font-size:15px;margin-bottom:10px;">Tableau des gains</h3>'
      +   this.ledgerTable(game)
      + '</div>'
      + this.deleteUniverseCard()
      + '</div>';
  },
  totalsRecapCard(game){
    return '<div class="card">'
      + '<h3 style="font-size:15px;margin-bottom:12px;">R\u00e9capitulatif des gains totaux</h3>'
      + '<div class="row" style="gap:10px;">'
      +   TEAM_ORDER.concat(['armateur']).map(t=>{
            const label = t==='armateur' ? 'Armateur' : TEAMS[t].label;
            const total = game.totals[t];
            return '<div class="card tight" style="flex:1 1 120px;text-align:center;background:var(--parchment-deep);">'
              + '<div class="muted" style="font-size:12px;">'+esc(label)+'</div>'
              + '<div class="gain '+gainClass(total)+' num" style="font-size:24px;">'+fmtSigned(total)+'</div>'
              + '</div>';
          }).join('')
      + '</div>'
      + '</div>';
  },
  async performAutoAdvanceNow(){
    this.stopTick();
    await this.performAutoAdvance();
  },
  deleteUniverseCard(){
    return '<div class="card tight" style="border-color:rgba(154,58,61,0.3);">'
      + '<div class="row" style="justify-content:space-between;align-items:center;">'
      +   '<span class="muted" style="font-size:13px;">Supprimer d\u00e9finitivement cet univers et son historique.</span>'
      +   (this.state.confirmDeleteDetail
            ? '<span class="row" style="gap:8px;">'
                + '<button class="btn btn-danger" onclick="App.confirmDeleteFromDetail()">Oui, supprimer</button>'
                + '<button class="btn btn-ghost" onclick="App.state.confirmDeleteDetail=false;App.render();">Annuler</button>'
              + '</span>'
            : '<button class="btn btn-ghost" style="color:var(--rust);" onclick="App.state.confirmDeleteDetail=true;App.render();">Supprimer l\u2019univers</button>')
      + '</div>'
      + '</div>';
  },
  async confirmDeleteFromDetail(){
    await deleteGame(this.state.code);
    this.setView('console-dashboard');
  },
  toggleExtend(){ this.state.showExtend = !this.state.showExtend; this.render(); },
  extendForm(){
    return '<div class="card tight" style="margin-top:12px;background:var(--parchment-deep);">'
      + '<div class="row">'
      +   [1,3,5].map(n=>'<button class="btn btn-ghost" onclick="App.doExtend('+n+')">+'+n+'</button>').join('')
      +   '<input id="extend-custom" class="input" type="number" min="1" max="30" placeholder="Autre" style="width:90px;">'
      +   '<button class="btn btn-gold" onclick="App.doExtendCustom()">Ajouter</button>'
      + '</div>'
      + '</div>';
  },
  async doExtend(n){
    let game = await loadGame(this.state.code);
    game = extendRounds(game, n);
    await saveGame(game);
    this.state.showExtend = false;
    this.state.game = game;
    this.lastSnapshot = JSON.stringify(game);
    this.render();
  },
  async doExtendCustom(){
    const el = document.getElementById('extend-custom');
    const n = parseInt(el.value, 10);
    if (n && n > 0) await this.doExtend(Math.min(n,30));
  },
  toggleStopConfirm(){ this.state.confirmStop = !this.state.confirmStop; this.render(); },
  stopConfirm(){
    return '<div class="inline-confirm" style="margin-top:12px;">'
      + '<span>Arr\u00eater la partie maintenant ? Le classement sera fig\u00e9 sur les tours d\u00e9j\u00e0 jou\u00e9s.</span>'
      + '<div class="row">'
      +   '<button class="btn btn-danger" onclick="App.doStop()">Oui, arr\u00eater</button>'
      +   '<button class="btn btn-ghost" onclick="App.toggleStopConfirm()">Annuler</button>'
      + '</div>'
      + '</div>';
  },
  async doStop(){
    let game = await loadGame(this.state.code);
    game = stopGame(game);
    await saveGame(game);
    this.state.game = game;
    this.state.confirmStop = false;
    this.lastSnapshot = JSON.stringify(game);
    this.render();
  },
  pinsCard(game){
    return '<div class="card tight">'
      + '<div class="row" style="justify-content:space-between;align-items:center;">'
      +   '<h3 style="font-size:14px;">Codes \u00e9quipages \u00e0 distribuer</h3>'
      +   '<span class="muted" style="font-size:12px;">Univers&nbsp;<strong class="num">'+esc(game.code)+'</strong></span>'
      + '</div>'
      + '<div class="row" style="margin-top:10px;gap:10px;">'
      +   TEAM_ORDER.map(t=>'<div class="card tight" style="flex:1 1 140px;background:var(--parchment-deep);text-align:center;">'
            + '<div class="muted" style="font-size:12px;">'+esc(TEAMS[t].label)+'</div>'
            + '<div class="num" style="font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--sea-deep);">'+esc(game.teamPins[t])+'</div>'
            + '</div>').join('')
      + '</div>'
      + '</div>';
  },
  ledgerTable(game){
    const rows = game.rounds.map((r,i)=>{
      if (!r.resolved){
        return '<tr><td class="num">'+(i+1)+'</td><td colspan="3" class="muted">\u2014</td><td class="muted">\u2014</td></tr>';
      }
      return '<tr><td class="num">'+(i+1)+'</td>'
        + TEAM_ORDER.map(t=>'<td><span class="cell-letter">'+r[t]+'</span> <span class="gain '+gainClass(r.gains[t])+' num">'+fmtSigned(r.gains[t])+'</span></td>').join('')
        + '<td><span class="gain '+gainClass(r.gains.armateur)+' num">'+fmtSigned(r.gains.armateur)+'</span></td>'
        + '</tr>';
    }).join('');
    return '<div class="ledger-wrap"><table class="ledger">'
      + '<thead><tr><th>N&deg;</th><th>Pinta</th><th>Santa Maria</th><th>Ni\u00f1a</th><th>Armateur</th></tr></thead>'
      + '<tbody>'+rows+'</tbody>'
      + '<tfoot><tr><td>Total</td>'
      +   TEAM_ORDER.map(t=>'<td class="gain '+gainClass(game.totals[t])+' num">'+fmtSigned(game.totals[t])+'</td>').join('')
      +   '<td class="gain '+gainClass(game.totals.armateur)+' num">'+fmtSigned(game.totals.armateur)+'</td>'
      + '</tr></tfoot>'
      + '</table></div>';
  },
};

// intercepte l'entrée dans la console pour vérifier le mot de passe une fois
const _origSetView = App.setView.bind(App);
App.setView = function(view, extra){
  _origSetView(view, extra);
  if (view === 'console-gate') App.ensureGateChecked();
};

App.init();
</script>
</body>
</html>
